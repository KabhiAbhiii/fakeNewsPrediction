<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detector</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            background:#0f172a;
            color:#f8fafc;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:30px;
        }

        .container{
            width:750px;
            background:#1e293b;
            border:1px solid #334155;
            border-radius:16px;
            padding:35px;
            box-shadow:0 15px 35px rgba(0,0,0,.45);
        }

        h1{
            text-align:center;
            font-size:34px;
            margin-bottom:10px;
            color:#ffffff;
        }

        .subtitle{
            text-align:center;
            color:#94a3b8;
            margin-bottom:30px;
            font-size:15px;
        }

        textarea{
            width:100%;
            height:260px;
            background:#0f172a;
            color:white;
            border:1px solid #475569;
            border-radius:10px;
            padding:18px;
            font-size:15px;
            resize:vertical;
            outline:none;
            transition:.25s;
        }

        textarea:focus{
            border-color:#3b82f6;
            box-shadow:0 0 12px rgba(59,130,246,.35);
        }

        textarea::placeholder{
            color:#64748b;
        }

        button{
            width:100%;
            margin-top:22px;
            padding:15px;
            background:#2563eb;
            border:none;
            color:white;
            font-size:17px;
            border-radius:10px;
            cursor:pointer;
            transition:.25s;
            font-weight:600;
        }

        button:hover{
            background:#1d4ed8;
            transform:translateY(-2px);
        }

        .result{
            margin-top:30px;
            padding:18px;
            border-radius:10px;
            text-align:center;
            font-size:18px;
            font-weight:bold;
            background:#0f172a;
            border-left:5px solid #3b82f6;
            color:#ffffff;
        }

        footer{
            margin-top:25px;
            text-align:center;
            color:#64748b;
            font-size:13px;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>Fake News Detector</h1>

    <p class="subtitle">
        Paste a news article below and let the machine learning model determine
        whether it is <strong>Real</strong> or <strong>Fake</strong>.
    </p>

    <form action="/predict" method="POST">

        <textarea
            name="text"
            placeholder="Paste the news article here..."
            required></textarea>

        <button type="submit">
            Analyze Article
        </button>

    </form>

    {% if prediction_text %}
        <div class="result">
            {{ prediction_text }}
        </div>
    {% endif %}

    <footer>Made by Abhishek Yadav,Abhinav,Anshuman Singh,Ashu Soni</footer>

</div>

</body>
</html>
